<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About — JCH Portfolio</title>
  <link rel="stylesheet" href="../src/styles/tokens.css">
  <link rel="stylesheet" href="../src/styles/notebook.css">
  <style>
    html, body { margin: 0; padding: 0; background: var(--paper); }
    html { scroll-behavior: smooth; }

    /* 이 페이지는 page.css 가 없고 스타일이 AboutPage.jsx 안에 인라인으로 있다.
       아래 둘은 공유 크롬(notebook.css) 을 덮는 것이라 여기 둔다. */
    @media (max-width: 720px) {
      /* 공유 .nb-nav 가 모바일 폭에서 헤더 밖으로 밀려 페이지를 가로로 민다 (실측 630 > 390).
         같은 목적지를 좌측 레일과 crumb 이 이미 갖고 있어 여기서는 내린다. */
      .nb-header .nb-nav { display: none; }
      /* 320px 기기에서 brand + crumb 전체가 헤더 폭을 넘는다. 브랜드가 같은 목적지를 갖는다. */
      .nb-header .nb-crumbs a,
      .nb-header .nb-crumbs .sep { display: none; }
    }
    /* 링크 줄 끝의 장식 화살표가 부모 밖 3px 로 나가 페이지를 가로로 민다.
       내용 열에서 잘라 준다 — 레일은 형제라 영향받지 않는다. */
    .nb-body > main { min-width: 0; overflow-x: clip; }
  </style>
</head>
<body data-screen-label="About">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="about/data.js"></script>
  <script type="text/babel" src="../src/views/notebook-components.jsx"></script>
  <script type="text/babel" src="about/AboutPage.jsx"></script>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<window.AboutPage />);
  </script>
</body>
</html>
